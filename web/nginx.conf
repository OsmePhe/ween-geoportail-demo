server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
  }

  location /geoserver/ {
    proxy_pass http://geoserver:8080;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
